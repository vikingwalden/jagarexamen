  <script>
/* Jägarprovet – fristående, serverfri demonstrationsapp. */
(() => {
  'use strict';
  const QUESTIONS = window.QUESTIONS || [];
  const INDEX = new Map(QUESTIONS.map(q => [q.id,q]));
  const TOPICS = [...new Set(QUESTIONS.map(q => q.topic))];
  const STORAGE = 'jagarprovet_v1';
  const ACTIVE = 'jagarprovet_active_v1';
  const root = document.getElementById('app');
  const state = read(STORAGE,{stats:{},attempts:[]});
  let session = read(ACTIVE,null);
  let view='home'; let currentResult=null; let returnView='home';
  const letters=['A','B','C','D'];
  function read(k,fallback){try{return JSON.parse(localStorage.getItem(k))||fallback}catch{return fallback}}
  function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch{}}
  function saveSession(){try{if(session)localStorage.setItem(ACTIVE,JSON.stringify(session));else localStorage.removeItem(ACTIVE)}catch{}}
  function escapeHTML(str){return String(str??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function shuffle(arr){const r=[...arr];for(let i=r.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
  function escAttr(str){return escapeHTML(str)}
  function pct(a,b){return b?Math.round(100*a/b):0}
  function dateTime(d){return new Date(d).toLocaleDateString('sv-SE',{year:'numeric',month:'short',day:'numeric'})}
  function record(q,selected,uncertain){let x=state.stats[q.id]||{seen:0,correct:0,wrong:0,uncertain:0};x.seen++;if(selected===q.answer)x.correct++;else x.wrong++;if(uncertain)x.uncertain++;state.stats[q.id]=x}
  function totalSeen(){return Object.values(state.stats).filter(v=>v.seen>0).length}
  function statsSummary(){let all=Object.values(state.stats);return{answered:all.reduce((s,x)=>s+x.seen,0),correct:all.reduce((s,x)=>s+x.correct,0)}}
  function button(label,id,variant=''){return `<button class="button ${variant}" id="${id}" type="button">${escapeHTML(label)}</button>`}
  function showHome(){
    view='home'; currentResult=null;
    const total=statsSummary(),last=state.attempts[0];
    root.innerHTML=`<div class="stack">
      <section><div class="eyebrow">DIN ÖVNINGSPLATS</div><h1>Träna smart inför<br>jägarexamen.</h1><p class="lead">50 frågor fördelade över tio områden. Korta pass, ett tidsatt mini-prov och förklaringar till varje alternativ.</p></section>
      <section class="gridstats"><div class="metric"><strong>${totalSeen()}/50</strong><span>Unika frågor sedda</span></div><div class="metric"><strong>${pct(total.correct,total.answered)} %</strong><span>Rätt över alla försök</span></div><div class="metric"><strong>${state.attempts.length}</strong><span>Avslutade pass</span></div></section>
      ${session?`<div class="disclaimer"><b>Du har ett pågående pass.</b> Fortsätt där du slutade. ${button('Fortsätt pass','resume')}</div>`:''}
      <section class="tiles"><button class="tile" id="goTrain"><div class="symbol">◎</div><strong>Ämnesträning</strong><span class="muted">Välj område, få direkt facit och lär av varje svar.</span></button><button class="tile" id="goExam"><div class="symbol">▤</div><strong>Mini-prov</strong><span class="muted">20 blandade frågor, 17 minuter och rättning i slutet.</span></button><button class="tile" id="goReview"><div class="symbol">↺</div><strong>Repetition</strong><span class="muted">Träna på tidigare fel och osäkra svar.</span></button><button class="tile" id="goStats"><div class="symbol">▥</div><strong>Resultat & statistik</strong><span class="muted">Se styrkor och svagheter per ämnesområde.</span></button></section>
      <div class="disclaimer"><b>Demoversion.</b> Det officiella teoriprovet har 70 frågor på 60 minuter och kräver minst 60 rätt. Med bara 50 frågor använder appen ett kortare, inofficiellt mini-prov. <a href="https://www.naturvardsverket.se/amnesomraden/jakt-och-vilt/for-jagare/teoriprov-jagarexamen/" target="_blank" rel="noopener">Officiell information</a>.</div>
      ${last?`<p class="small muted">Senaste passet: ${escAttr(dateTime(last.date))} · ${last.correct}/${last.total} rätt · ${escapeHTML(last.mode==='exam'?'Mini-prov':'Träning')}</p>`:''}</div>`;
    document.getElementById('goTrain').onclick=showTrainSetup;
    document.getElementById('goExam').onclick=showExamSetup;
    document.getElementById('goReview').onclick=showReviewSetup;
    document.getElementById('goStats').onclick=showStats;
    if(session)document.getElementById('resume').onclick=()=>{view='play';renderQuestion()};
  }
  function showTrainSetup(topic='Blandat'){
    view='setup';
    root.innerHTML=`<div class="stack"><div>${button('← Startsidan','home','ghost')}</div><div class="card stack"><div><div class="eyebrow">TRÄNING</div><h2>Välj vad du vill öva</h2><p class="muted small">Svara och få facit direkt. Du kan också markera svar som osäkra.</p></div><div class="formrow"><div class="field"><label for="topic">Ämne</label><select id="topic"><option value="Blandat">Blandat – alla ämnen</option>${TOPICS.map(t=>`<option value="${escAttr(t)}" ${t===topic?'selected':''}>${escapeHTML(t)}</option>`).join('')}</select></div><div class="field"><label for="count">Antal frågor</label><select id="count"><option value="5">5 frågor</option><option value="10" selected>10 frågor</option><option value="20">20 frågor</option></select></div></div><p class="small muted" id="countHint"></p>${button('Starta träning','startTrain')}</div></div>`;
    document.getElementById('home').onclick=showHome;
    const update=()=>{const topic=document.getElementById('topic').value;const count=Number(document.getElementById('count').value);const available=topic==='Blandat'?QUESTIONS.length:QUESTIONS.filter(q=>q.topic===topic).length;document.getElementById('countHint').textContent=`${available} frågor i detta urval. Passet blir ${Math.min(count,available)} frågor utan upprepning.`};
    document.getElementById('topic').onchange=update;document.getElementById('count').onchange=update;update();
    document.getElementById('startTrain').onclick=()=>start('practice',document.getElementById('topic').value,Number(document.getElementById('count').value));
  }
  function showExamSetup(){
    view='setup';root.innerHTML=`<div class="stack"><div>${button('← Startsidan','home','ghost')}</div><div class="card stack"><div class="eyebrow">TIDSATT DELPROV</div><h2>Mini-prov · 20 frågor</h2><div class="gridstats"><div class="metric"><strong>20</strong><span>Frågor</span></div><div class="metric"><strong>17 min</strong><span>Tid</span></div><div class="metric"><strong>10</strong><span>Ämnen</span></div></div><p>Frågorna blandas från de tio ämnena, två från varje. Du kan navigera och bokmärka frågor. Inget facit visas förrän du lämnat in eller tiden gått ut.</p><p class="disclaimer">Detta är inte ett officiellt teoriprov. Ingen gräns för godkänt/underkänt visas i demoversionen.</p>${button('Starta tidsatt mini-prov','startExam')}</div></div>`;
    document.getElementById('home').onclick=showHome;document.getElementById('startExam').onclick=()=>start('exam','Blandat',20);
  }
  function showReviewSetup(){
    view='setup';let weak=QUESTIONS.filter(q=>{const s=state.stats[q.id];return s&&(s.wrong>0||s.uncertain>0)});
    root.innerHTML=`<div class="stack"><div>${button('← Startsidan','home','ghost')}</div><div class="card stack"><div class="eyebrow">REPETITION</div><h2>Återvänd till svåra frågor</h2><p>${weak.length?`Du har ${weak.length} frågor med tidigare fel eller osäkerhetsmarkeringar.`:'Inga markerade eller felbesvarade frågor ännu. Genomför lite ämnesträning först.'}</p>${button('Starta repetition','startReview') }</div></div>`;
    document.getElementById('home').onclick=showHome;
    const b=document.getElementById('startReview');b.disabled=weak.length===0;b.onclick=()=>start('review','Blandat',Math.min(10,weak.length));
  }
  function sample(mode,topic,count){
    if(mode==='exam'){return shuffle(TOPICS.flatMap(t=>shuffle(QUESTIONS.filter(q=>q.topic===t)).slice(0,2)))}
    let pool=mode==='review'?QUESTIONS.filter(q=>{const s=state.stats[q.id];return s&&(s.wrong||s.uncertain)}):QUESTIONS.filter(q=>topic==='Blandat'||q.topic===topic);
    // Föredra obesvarade frågor. Dra slumpmässigt bland frågor med samma antal tidigare försök.
    return shuffle(pool).sort((a,b)=>(state.stats[a.id]?.seen||0)-(state.stats[b.id]?.seen||0)).slice(0,count);
  }
  function start(mode,topic,count){
    if(session&&!confirm('Ett tidigare pass är inte färdigt. Vill du ersätta det?'))return;
    const pool=sample(mode,topic,count);if(!pool.length){showHome();return}
    session={mode,topic,ids:pool.map(q=>q.id),index:0,choices:{},uncertain:{},confirmed:{},started:Date.now(),deadline:mode==='exam'?Date.now()+17*60*1000:null};
    saveSession();view='play';renderQuestion();
  }
  function currentQ(){return INDEX.get(session.ids[session.index])}
  function remaining(){return session&&session.deadline?Math.max(0,session.deadline-Date.now()):0}
  function timeLabel(ms){const sec=Math.ceil(ms/1000);return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
  function renderQuestion(){
    if(!session){showHome();return}
    if(session.mode==='exam'&&remaining()===0){finish(true);return}
    view='play';const q=currentQ(),at=session.index,total=session.ids.length,answered=Object.keys(session.confirmed).length;
    const isExam=session.mode==='exam';const locked=!!session.confirmed[q.id],selected=session.choices[q.id];const isUncertain=!!session.uncertain[q.id];
    root.innerHTML=`<div class="stack">
    <div class="qtop"><button class="button ghost" id="exit">← Avsluta</button><div class="buttons"><span class="pill ${isExam?'exam':''}">${isExam?'MINI-PROV':'TRÄNING'}</span>${isExam?`<span class="pill warn" id="timer">${timeLabel(remaining())}</span>`:''}</div></div>
    <div class="card"><div class="qtop"><span class="small muted">Fråga ${at+1} av ${total}</span><span class="tiny muted">${escapeHTML(q.topic)}</span></div><div class="progressbar"><div style="width:${100*(at+1)/total}%"></div></div>
    <div class="questionTitle">${escapeHTML(q.question)}</div>
    <div role="group" aria-label="Svarsalternativ">${q.options.map((o,i)=>`<button class="choice ${selected===i?'selected':''} ${locked&&i===q.answer?'correct':''} ${locked&&selected===i&&i!==q.answer?'wrong':''}" data-choice="${i}" ${locked?'disabled':''} aria-pressed="${selected===i}"><span class="letter">${letters[i]}</span><span>${escapeHTML(o.text)}</span></button>`).join('')}</div>
    <label class="qflag"><input type="checkbox" id="uncertain" ${isUncertain?'checked':''}> Markera som osäker / bokmärk</label>
    ${locked&&!isExam?feedback(q,selected):''}
    <hr class="rule"><div class="buttons"><button class="button alt" id="prev" ${at===0?'disabled':''}>← Föregående</button><div class="grow"></div>${!isExam&&!locked?button('Rätta svar','check'):''}${at<total-1?button('Nästa →','next'):button(isExam?'Lämna in mini-prov':'Visa resultat','finish')}</div>
    </div>
    ${isExam?`<div class="card"><div class="qtop"><strong class="small">Frågeöversikt</strong><span class="tiny muted">${Object.keys(session.choices).length}/${total} besvarade</span></div><div class="numbernav" style="margin-top:12px">${session.ids.map((id,i)=>`<button class="numbtn ${i===at?'active':''} ${session.choices[id]!=null?'answered':''} ${session.uncertain[id]?'flagged':''}" data-jump="${i}" aria-label="Gå till fråga ${i+1}">${i+1}</button>`).join('')}</div></div>`:''}
    </div>`;
    document.getElementById('exit').onclick=()=>{if(confirm('Avsluta passet? Dina svar i pågående pass raderas, men tidigare resultat finns kvar.')){session=null;saveSession();showHome()}};
    root.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(locked)return;session.choices[q.id]=Number(b.dataset.choice);saveSession();renderQuestion()});
    document.getElementById('uncertain').onchange=e=>{session.uncertain[q.id]=e.target.checked;saveSession()};
    document.getElementById('prev').onclick=()=>{session.index--;saveSession();renderQuestion()};
    const next=document.getElementById('next');if(next)next.onclick=()=>{session.index++;saveSession();renderQuestion()};
    const check=document.getElementById('check');if(check){check.disabled=selected==null;check.onclick=()=>{session.confirmed[q.id]=true;record(q,session.choices[q.id],!!session.uncertain[q.id]);persist();saveSession();renderQuestion()}};
    const fin=document.getElementById('finish');if(fin)fin.onclick=()=>{
      if(isExam){const unanswered=session.ids.filter(id=>session.choices[id]==null).length;if(unanswered&&!confirm(`Du har ${unanswered} obesvarade frågor. Vill du lämna in ändå?`))return}
      else if(!session.ids.every(id=>session.confirmed[id])){if(!confirm('Det finns frågor som inte är rättade. De räknas som obesvarade. Vill du avsluta?'))return}
      finish(false)
    };

  }
  function feedback(q,selected){return `<div class="feedback"><strong class="${selected===q.answer?'good':'bad'}">${selected===q.answer?'Rätt svar':'Inte riktigt'} — rätt svar är ${letters[q.answer]}</strong>${q.options.map((o,i)=>`<article><b class="${i===q.answer?'good':i===selected?'bad':''}">${letters[i]}. ${escapeHTML(o.text)}</b><br><span class="muted">${escapeHTML(o.explanation)}</span></article>`).join('')}${q.ref?`<a class="small" target="_blank" rel="noopener noreferrer" href="${escAttr(q.ref)}">Kontrollera källan ↗</a>`:''}</div>`}
  function finish(timeout){
    if(!session)return;const ended=session;

    const a={id:Date.now(),mode:ended.mode,date:Date.now(),correct:n,total,topic:ended.topic,timeout:!!timeout,items:ended.ids.map(id=>({id,choice:ended.choices[id]??null,uncertain:!!ended.uncertain[id]}))};
    state.attempts.unshift(a);state.attempts=state.attempts.slice(0,60);persist();session=null;saveSession();showResult(a);
  }
  function showResult(a){view='result';currentResult=a;
    const questions=a.items.map(item=>({q:INDEX.get(item.id),...item})).filter(x=>x.q);
    root.innerHTML=`<div class="stack"><div class="eyebrow">${a.mode==='exam'?'RESULTAT: MINI-PROV':'RESULTAT: TRÄNING'}</div><div class="card stack"><div class="resultscore">${a.correct}/${a.total}</div><h2 style="margin:0">${pct(a.correct,a.total)} procent rätt</h2><p class="muted">${a.timeout?'Tiden gick ut. Obesvarade frågor räknas som fel.':'Passet är färdigt.'} ${a.mode==='exam'?'Det här var ett kort övningsprov, inte ett officiellt godkänt/underkänt-resultat.':''}</p><div class="buttons">${button('Till startsidan','toHome')}${button('Nytt träningspass','again','alt')}</div></div><div><h2>Gå igenom svaren</h2><p class="small muted">Tryck på en fråga för att se förklaringen till samtliga fyra alternativ.</p></div>${questions.map((x,i)=>`<details class="result-item"><summary><span class="sign ${x.choice===x.q.answer?'good':'bad'}">${x.choice===x.q.answer?'✓':'×'}</span><span>${i+1}. ${escapeHTML(x.q.question)} ${x.uncertain?'<span class="pill warn">Osäker</span>':''}</span></summary><div class="inside"><p class="small muted">Ditt svar: ${x.choice==null?'Inget svar':letters[x.choice]}. Rätt svar: ${letters[x.q.answer]}.</p>${feedback(x.q,x.choice)}</div></details>`).join('')}</div>`;
    document.getElementById('toHome').onclick=showHome;document.getElementById('again').onclick=()=>showTrainSetup(a.mode==='practice'?a.topic:'Blandat');window.scrollTo(0,0);
  }
  function showStats(){view='stats';const summary=statsSummary();const topics=TOPICS.map(t=>{const qs=QUESTIONS.filter(q=>q.topic===t);const stats=qs.map(q=>state.stats[q.id]).filter(Boolean);const attempts=stats.reduce((s,x)=>s+x.seen,0);const correct=stats.reduce((s,x)=>s+x.correct,0);return{t,seen:stats.length,attempts,correct}});
    root.innerHTML=`<div class="stack"><div>${button('← Startsidan','home','ghost')}</div><div><div class="eyebrow">DIN STATISTIK</div><h1>Utveckling</h1></div><div class="card stack"><div class="gridstats"><div class="metric"><strong>${totalSeen()}/50</strong><span>Unika sedda</span></div><div class="metric"><strong>${pct(summary.correct,summary.answered)} %</strong><span>Alla svar</span></div><div class="metric"><strong>${state.attempts.length}</strong><span>Pass</span></div></div><h2>Per ämne</h2>${topics.map(x=>`<div class="category-row"><div style="flex:1"><strong class="small">${escapeHTML(x.t)}</strong><div class="tiny muted">${x.seen}/5 unika · ${x.attempts} svar</div><div class="mini-bar"><div style="width:${pct(x.correct,x.attempts)}%"></div></div></div><strong>${x.attempts?pct(x.correct,x.attempts)+' %':'–'}</strong></div>`).join('')}</div><div class="card stack"><h2>Senaste pass</h2>${state.attempts.length?state.attempts.slice(0,8).map(a=>`<div class="category-row"><span>${escapeHTML(dateTime(a.date))} · ${a.mode==='exam'?'Mini-prov':escapeHTML(a.topic)}</span><strong>${a.correct}/${a.total}</strong></div>`).join(''):'<p class="muted">Inga avslutade pass än.</p>'}<div class="buttons">${button('Exportera mina resultat','exportStats','alt')}${button('Importera resultat','importStats','alt')}${button('Nollställ statistik','clearStats','danger')}</div><input id="importFile" type="file" accept=".json,application/json" class="hidden"></div></div>`;
    document.getElementById('home').onclick=showHome;
    document.getElementById('exportStats').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,stats:state.stats,attempts:state.attempts},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='jagarprovet-resultat.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};
    document.getElementById('importStats').onclick=()=>document.getElementById('importFile').click();
    document.getElementById('importFile').onchange=async(e)=>{try{const f=e.target.files[0];if(!f)return;const v=JSON.parse(await f.text());if(v.version!==1||typeof v.stats!=='object'||!Array.isArray(v.attempts))throw Error('Ogiltig fil');if(!confirm('Importera filen? Nuvarande sparade resultat ersätts.'))return;state.stats=v.stats;state.attempts=v.attempts;persist();showStats()}catch{alert('Kunde inte läsa resultatfilen.')}};
    document.getElementById('clearStats').onclick=()=>{if(confirm('Ta bort alla sparade resultat på denna enhet? Detta går inte att ångra.')){state.stats={};state.attempts=[];persist();showStats()}};
  }
  const logo=document.getElementById('logo');logo.onclick=e=>{e.preventDefault();showHome()};
  if(session && (!Array.isArray(session.ids)||session.ids.some(id=>!INDEX.has(id)))){session=null;saveSession()}
  showHome();
  setInterval(()=>{if(session&&session.mode==='exam'){
    const badge=document.getElementById('timer');if(badge)badge.textContent=timeLabel(remaining());
    if(remaining()<=0)finish(true)
  }},1000);
  if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();

  </script>
</body>
</html>
