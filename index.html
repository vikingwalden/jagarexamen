  <style>
  :root{color-scheme:light;--forest:#153f38;--forest2:#246252;--cream:#f6f5ee;--paper:#fffefb;--ink:#20302b;--muted:#61756d;--stroke:#dfe6dd;--mint:#dbece2;--success:#21694c;--danger:#9b3f38;--redbg:#fbeae7;--gold:#b47929;--shadow:0 6px 30px rgba(20,45,32,.065)}
  *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.48}h1,h2,h3,p{margin-top:0}h1,h2{letter-spacing:-.03em}h1{font-size:clamp(1.9rem,5vw,2.65rem);line-height:1.15}h2{font-size:1.45rem;line-height:1.2}.small{font-size:.88rem}.tiny{font-size:.76rem}.muted{color:var(--muted)}.wrap{max-width:860px;padding:0 18px;margin:auto}.top{background:var(--forest);color:white}.top-inner{max-width:860px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px}.brand{color:white;font-size:1.18rem;text-decoration:none;font-weight:760;letter-spacing:-.025em}.brand em{font-style:normal;color:#a2d6b8}.top-right{color:#b9d5c7;font-size:.78rem}.main{padding:28px 0 70px}.eyebrow{font-weight:760;color:var(--forest2);font-size:.74rem;letter-spacing:.10em;text-transform:uppercase;margin-bottom:10px}.lead{color:var(--muted);font-size:1.03rem;max-width:54ch}.card{background:var(--paper);border:1px solid var(--stroke);border-radius:17px;padding:23px;box-shadow:var(--shadow)}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.tile{border:1px solid var(--stroke);border-radius:15px;background:var(--paper);padding:20px;text-align:left;color:var(--ink);transition:transform .12s,border-color .12s;box-shadow:var(--shadow)}.tile:hover,.tile:focus-visible{border-color:var(--forest2);transform:translateY(-1px)}.tile .symbol{font-size:1.55rem;color:var(--forest);line-height:1;margin-bottom:13px;font-weight:bold}.tile strong{display:block;font-size:1.08rem;margin-bottom:5px}.tile .muted{display:block;font-size:.88rem}.stack{display:flex;flex-direction:column;gap:17px}.gridstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric{background:#edf3ec;padding:14px;border-radius:12px}.metric strong{font-size:1.35rem;display:block;white-space:nowrap;color:var(--forest)}.metric span{font-size:.78rem;color:var(--muted)}.button{background:var(--forest);border:1px solid var(--forest);border-radius:10px;padding:12px 18px;color:#fff;font-weight:700;min-height:46px}.button:hover:not(:disabled){background:#225549}.button.alt{background:var(--paper);border-color:#aec2b6;color:var(--forest)}.button.alt:hover:not(:disabled){background:var(--mint)}.button.ghost{background:transparent;border-color:transparent;color:var(--forest)}.button.danger{background:#fff;border-color:#cda29b;color:var(--danger)}.buttons{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.buttons .grow{flex-grow:1}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:150px}.field label{font-weight:680;font-size:.9rem}select{width:100%;background:white;border:1px solid #bfcec3;border-radius:10px;padding:12px;color:var(--ink);min-height:46px}.formrow{display:flex;gap:12px;flex-wrap:wrap}.rule{border:0;border-top:1px solid var(--stroke);margin:20px 0}.pill{border-radius:50px;background:#e8eee7;padding:5px 11px;color:#456254;font-size:.79rem;font-weight:650;display:inline-block}.pill.warn{color:#7f581b;background:#f7eacd}.pill.exam{color:#fff;background:#356b5b}.questionTitle{font-size:clamp(1.21rem,3vw,1.52rem);font-weight:740;line-height:1.37;letter-spacing:-.018em;margin:15px 0 20px}.choice{width:100%;display:flex;align-items:flex-start;gap:12px;background:#fff;border:1.5px solid #d6e0d7;border-radius:12px;padding:13px 14px;text-align:left;margin-bottom:10px;color:var(--ink);line-height:1.42}.choice:hover:not(:disabled){border-color:#629780}.choice.selected{background:#e7f2eb;border-color:var(--forest2)}.choice.correct{background:#e0f1e6;border-color:#65a584}.choice.wrong{background:var(--redbg);border-color:#cc8b81}.choice .letter{flex:0 0 25px;height:26px;border-radius:7px;background:#eef2ed;text-align:center;line-height:26px;font-size:.84rem;font-weight:760}.choice.correct .letter{background:#b3dac2}.choice.wrong .letter{background:#f2c9c1}.choice:disabled{opacity:1;cursor:default}.choice:focus-visible,.button:focus-visible,.tile:focus-visible{outline:3px solid #bd9b4c;outline-offset:2px}.feedback{border-radius:12px;border:1px solid var(--stroke);padding:15px;background:#f8faf6;margin-top:17px}.feedback strong{display:block}.feedback article{padding:9px 0;border-bottom:1px solid var(--stroke);font-size:.88rem}.feedback article:last-child{border-bottom:0}.feedback article b{font-weight:760}.feedback .good{color:var(--success)}.feedback .bad{color:var(--danger)}.progressbar{height:8px;background:#e2e8df;border-radius:50px;overflow:hidden;margin:13px 0 17px}.progressbar div{height:100%;background:var(--forest2);border-radius:50px;transition:width .15s}.qtop{display:flex;justify-content:space-between;gap:10px;align-items:center}.qflag{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.86rem;cursor:pointer}.qflag input{width:17px;height:17px;accent-color:var(--forest)}.numbernav{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}.numbtn{border:1px solid #cad8cc;background:white;border-radius:8px;height:36px;font-weight:700;color:var(--ink)}.numbtn.answered{background:#dcefe4;border-color:#76a98a}.numbtn.active{outline:2px solid var(--forest);outline-offset:0}.numbtn.flagged:after{content:'•';color:#a67923;margin-left:2px}.result-item{border:1px solid var(--stroke);border-radius:12px;background:white;margin-bottom:9px;overflow:hidden}.result-item summary{cursor:pointer;padding:15px;font-weight:680;display:flex;align-items:flex-start;gap:10px;list-style:none}.result-item summary::-webkit-details-marker{display:none}.result-item summary .sign{flex:0 0 22px;text-align:center}.result-item .inside{padding:0 15px 16px}.category-row{display:flex;gap:9px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--stroke);padding:10px 0}.category-row:last-child{border-bottom:0}.mini-bar{height:6px;background:#e4ece5;border-radius:50px;overflow:hidden;margin-top:5px}.mini-bar div{height:100%;background:#4c9273}.footer{border-top:1px solid var(--stroke);padding:22px 0 42px;color:#688074;font-size:.78rem}.footer a{color:var(--forest2)}.disclaimer{background:#fbf0dc;border:1px solid #eddfbe;color:#6d542d;border-radius:12px;padding:12px 15px;font-size:.85rem}.hidden{display:none!important}.resultscore{font-size:3rem;font-weight:800;letter-spacing:-.06em;line-height:1;color:var(--forest)}
  @media(max-width:570px){.tiles{grid-template-columns:1fr}.gridstats{gap:7px}.metric{padding:12px 9px}.metric strong{font-size:1.18rem}.card{padding:17px}.top-inner{padding:15px 18px}.numbernav{grid-template-columns:repeat(5,minmax(0,1fr))}.main{padding-top:20px}.button{padding:11px 13px}.buttons .mobilewide{width:100%}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}

  /* Valfria bilder i frågor och svar */
  .quiz-figure{margin:0 0 19px;max-width:100%}
  .quiz-image{display:block;width:100%;height:auto;max-height:420px;object-fit:contain;background:#edf2ed;border:1px solid var(--stroke);border-radius:12px}
  .quiz-image-link{display:block;text-decoration:none;color:inherit}
  .quiz-caption{margin-top:7px;color:var(--muted);font-size:.79rem;line-height:1.4}
  .quiz-caption a{color:var(--forest2);text-decoration:underline;text-underline-offset:2px}
  .option-body{display:flex;flex-direction:column;gap:7px;min-width:0;width:100%}
  .option-image{width:100%;max-width:300px;max-height:195px;object-fit:contain;border-radius:8px;background:#edf2ed;border:1px solid var(--stroke)}
  .option-credit{font-size:.73rem;color:var(--muted);line-height:1.35}
  .editor-info{background:#eef4ef;border:1px solid #d1e0d3;padding:13px;border-radius:11px;font-size:.88rem}
  .editor-preview img{max-height:270px}
  input[type=text],input[type=url]{width:100%;background:white;border:1px solid #bfcec3;border-radius:10px;padding:12px;color:var(--ink);min-height:46px}
  input[type=file]{width:100%;max-width:100%}
  @media(max-width:570px){.quiz-image{max-height:330px}.option-image{max-height:175px}}

<body>
  <header class="top"><div class="top-inner"><a href="#" class="brand" id="logo">JÄGAR<em>PROVET</em></a><span class="top-right" id="topBadge">Läser in frågor …</span></div></header>
  <main class="wrap main" id="app" aria-live="polite"></main>
  <footer class="footer"><div class="wrap">En fristående, inofficiell övningsapp. Frågorna är egenförfattade och ersätter inte uppdaterad kurslitteratur eller myndighetsregler. Resultat sparas lokalt i din webbläsare. Bildfrågor kan använda egna filer eller externa bildadresser. <a href="https://www.naturvardsverket.se/amnesomraden/jakt-och-vilt/for-jagare/teoriprov-jagarexamen/" target="_blank" rel="noopener noreferrer">Om det officiella provet</a>.</div></footer>
  <script>
'use strict';
function START_JAGARPROVET_APP() {
/* Jägarprovet – fristående, serverfri demonstrationsapp. */
(() => {
  'use strict';
  const QUESTIONS = window.QUESTIONS || [];
  const INDEX = new Map(QUESTIONS.map(q => [q.id,q]));
  const TOPICS = [...new Set(QUESTIONS.map(q => q.topic))];
  const FULL_EXAM = QUESTIONS.length >= 70;
  const EXAM_COUNT = FULL_EXAM ? 70 : Math.min(20, QUESTIONS.length);
  const EXAM_MINS = FULL_EXAM ? 60 : 17;
  const STORAGE = 'jagarprovet_v1';
  const ACTIVE = 'jagarprovet_active_v1';
  const root = document.getElementById('app');
  const state = read(STORAGE,{stats:{},attempts:[]});
  let session = read(ACTIVE,null);
  let view='home'; let currentResult=null; let returnView='home';
  const letters=['A','B','C','D'];
  function read(k,fallback){try{return JSON.parse(localStorage.getItem(k))||fallback}catch{return fallback}}
  function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch{}}
  function saveSession(){try{if(session)localStorage.setItem(ACTIVE,JSON.stringify(session));else localStorage.removeItem(ACTIVE)}catch{}}
  function escapeHTML(str){return String(str??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function shuffle(arr){const r=[...arr];for(let i=r.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
  function escAttr(str){return escapeHTML(str)}
  // Externa bilder ska ha HTTPS. Lokala bilder ska ligga i mappen bilder/.
  function safeImageSrc(src){
    if(typeof src!=='string')return null;
    const s=src.trim();
    if(!s||s.length>1800||/[\x00-\x1f]/.test(s))return null;
    if(/^https:\/\/[^\s]+$/i.test(s))return s;
    if(/^(?:\.\/)?bilder\/[\p{L}\p{N}_.%() +\/-]+\.(?:png|jpe?g|webp|gif)$/iu.test(s) && !s.includes('..'))return s;
    return null;
  }
  function safeWebLink(s){return typeof s==='string'&&/^https:\/\/[^\s]+$/i.test(s.trim())?s.trim():null}
  function mediaObj(obj){return typeof obj==='string'?{src:obj}:obj}
  function imageHtml(raw,option=false){
    const m=mediaObj(raw);if(!m||typeof m!=='object')return '';
    const src=safeImageSrc(m.src);if(!src)return '';
    const alt=escapeHTML(m.alt||(option?'Illustration för svarsalternativ':'Bild till frågan'));
    const img=`<img class="${option?'option-image':'quiz-image'}" loading="lazy" src="${escAttr(src)}" alt="${alt}">`;
    const cap=m.caption?escapeHTML(m.caption):'';
    const credit=m.credit?escapeHTML(m.credit):'';
    const creditUrl=safeWebLink(m.creditUrl);
    const creditMarkup=credit?(creditUrl?`<a href="${escAttr(creditUrl)}" rel="noopener noreferrer" target="_blank">${credit}</a>`:credit):'';
    if(option)return `${img}${credit?`<span class="option-credit">Bild: ${creditMarkup}</span>`:''}`;
    return `<figure class="quiz-figure"><a class="quiz-image-link" target="_blank" rel="noopener noreferrer" href="${escAttr(src)}" title="Öppna större bild">${img}</a>${cap||credit?`<figcaption class="quiz-caption">${cap}${cap&&credit?' · ':''}${credit?`Bild: ${creditMarkup}`:''} · Tryck på bilden för större format</figcaption>`:'<figcaption class="quiz-caption">Tryck på bilden för större format</figcaption>'}</figure>`;
  }
  function downloadJson(obj,name){
    const blob=new Blob([JSON.stringify(obj,null,2)+'\n'],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
  }
  function pct(a,b){return b?Math.round(100*a/b):0}
  function dateTime(d){return new Date(d).toLocaleDateString('sv-SE',{year:'numeric',month:'short',day:'numeric'})}
  function record(q,selected,uncertain){let x=state.stats[q.id]||{seen:0,correct:0,wrong:0,uncertain:0};x.seen++;if(selected===q.answer)x.correct++;else x.wrong++;if(uncertain)x.uncertain++;state.stats[q.id]=x}
  function totalSeen(){return Object.values(state.stats).filter(v=>v.seen>0).length}
  function statsSummary(){let all=Object.values(state.stats);return{answered:all.reduce((s,x)=>s+x.seen,0),correct:all.reduce((s,x)=>s+x.correct,0)}}
  function button(label,id,variant=''){return `<button class="button ${variant}" id="${id}" type="button">${escapeHTML(label)}</button>`}
  function showHome(){
    view='home'; currentResult=null;
    const total=statsSummary(),last=state.attempts[0],withSource=QUESTIONS.filter(q=>typeof q.ref==='string' && q.ref.startsWith('https://')).length;
    root.innerHTML=`<div class="stack">
      <section><div class="eyebrow">DIN ÖVNINGSPLATS</div><h1>Träna smart inför<br>jägarexamen.</h1><p class="lead">${QUESTIONS.length} frågor fördelade över ${TOPICS.length} områden. Korta pass, tidsatt provläge och förklaringar till varje alternativ. ${withSource} frågor med källänk; övriga behöver fortsatt faktagranskning.</p></section>
      <section class="gridstats"><div class="metric"><strong>${totalSeen()}/${QUESTIONS.length}</strong><span>Unika frågor sedda</span></div><div class="metric"><strong>${pct(total.correct,total.answered)} %</strong><span>Rätt över alla försök</span></div><div class="metric"><strong>${state.attempts.length}</strong><span>Avslutade pass</span></div></section>
      ${session?`<div class="disclaimer"><b>Du har ett pågående pass.</b> Fortsätt där du slutade. ${button('Fortsätt pass','resume')}</div>`:''}
      <section class="tiles"><button class="tile" id="goTrain"><div class="symbol">◎</div><strong>Ämnesträning</strong><span class="muted">Välj område, få direkt facit och lär av varje svar.</span></button><button class="tile" id="goExam"><div class="symbol">▤</div><strong>${FULL_EXAM?'70-frågors prov':'Mini-prov'}</strong><span class="muted">${EXAM_COUNT} blandade frågor, ${EXAM_MINS} minuter och rättning i slutet.</span></button><button class="tile" id="goReview"><div class="symbol">↺</div><strong>Repetition</strong><span class="muted">Träna på tidigare fel och osäkra svar.</span></button><button class="tile" id="goStats"><div class="symbol">▥</div><strong>Resultat & statistik</strong><span class="muted">Se styrkor och svagheter per ämnesområde.</span></button></section>
      <div class="disclaimer"><b>Demoversion.</b> Det officiella teoriprovet har 70 frågor på 60 minuter och kräver minst 60 rätt. ${FULL_EXAM?'Appen kan nu välja 70 frågor, men frågebanken behöver växa och granskas vidare.':'Frågebanken är ännu för liten för ett fullständigt övningsprov.'} <a href="https://www.naturvardsverket.se/amnesomraden/jakt-och-vilt/for-jagare/teoriprov-jagarexamen/" target="_blank" rel="noopener">Officiell information</a>.</div>
      <div class="buttons"><button class="button alt" id="goImageEditor">Bildverktyg för frågebanken</button></div>
      ${last?`<p class="small muted">Senaste passet: ${escAttr(dateTime(last.date))} · ${last.correct}/${last.total} rätt · ${escapeHTML(last.mode==='exam'?'Mini-prov':'Träning')}</p>`:''}</div>`;
    document.getElementById('goTrain').onclick=showTrainSetup;
    document.getElementById('goExam').onclick=showExamSetup;
    document.getElementById('goReview').onclick=showReviewSetup;
    document.getElementById('goStats').onclick=showStats;
    document.getElementById('goImageEditor').onclick=showImageEditor;
    if(session)document.getElementById('resume').onclick=()=>{view='play';renderQuestion()};
  }
  function showTrainSetup(topic='Blandat'){
    view='setup';
    root.innerHTML=`<div class="stack"><div>${button('← Startsidan','home','ghost')}</div><div class="card stack"><div><div class="eyebrow">TRÄNING</div><h2>Välj vad du vill öva</h2><p class="muted small">Svara och få facit direkt. Du kan också markera svar som osäkra.</p></div><div class="formrow"><div class="field"><label for="topic">Ämne</label><select id="topic"><option value="Blandat">Blandat – alla ämnen</option>${TOPICS.map(t=>`<option value="${escAttr(t)}" ${t===topic?'selected':''}>${escapeHTML(t)}</option>`).join('')}</select></div><div class="field"><label for="subtopic">Underområde</label><select id="subtopic"><option value="Alla">Alla underområden</option></select></div><div class="field"><label for="count">Antal frågor</label><select id="count"><option value="5">5 frågor</option><option value="10" selected>10 frågor</option><option value="20">20 frågor</option></select></div></div><p class="small muted" id="countHint"></p>${button('Starta träning','startTrain')}</div></div>`;
    document.getElementById('home').onclick=showHome;
    const update=()=>{const topic=document.getElementById('topic').value;const subSelect=document.getElementById('subtopic');const prior=subSelect.value;const subs=[...new Set(QUESTIONS.filter(q=>topic==='Blandat'||q.topic===topic).map(q=>q.subcategory||q.topic))];subSelect.innerHTML='<option value="Alla">Alla underområden</option>'+subs.map(s=>`<option value="${escAttr(s)}">${escapeHTML(s)}</option>`).join('');subSelect.value=subs.includes(prior)?prior:'Alla';const count=Number(document.getElementById('count').value);const available=QUESTIONS.filter(q=>(topic==='Blandat'||q.topic===topic)&&(subSelect.value==='Alla'||(q.subcategory||q.topic)===subSelect.value)).length;document.getElementById('countHint').textContent=`${available} frågor i urvalet. Passet blir ${Math.min(count,available)} frågor utan upprepning.`};
    document.getElementById('topic').onchange=()=>{document.getElementById('subtopic').value='Alla';update()};document.getElementById('subtopic').onchange=()=>{const topic=document.getElementById('topic').value;const sub=document.getElementById('subtopic').value;const count=Number(document.getElementById('count').value);const available=QUESTIONS.filter(q=>(topic==='Blandat'||q.topic===topic)&&(sub==='Alla'||(q.subcategory||q.topic)===sub)).length;document.getElementById('countHint').textContent=`${available} frågor i urvalet. Passet blir ${Math.min(count,available)} frågor utan upprepning.`};document.getElementById('count').onchange=document.getElementById('subtopic').onchange;update();
    document.getElementById('startTrain').onclick=()=>start('practice',document.getElementById('topic').value,Number(document.getElementById('count').value),document.getElementById('subtopic').value);
  }
  function showExamSetup(){
    view='setup';root.innerHTML=`<div class="stack"><div>${button('← Startsidan','home','ghost')}</div><div class="card stack"><div class="eyebrow">${FULL_EXAM?'TIDSATT ÖVNINGSPROV':'TIDSATT DELPROV'}</div><h2>${FULL_EXAM?"Provliknande övningsprov":"Mini-prov"} · ${EXAM_COUNT} frågor</h2><div class="gridstats"><div class="metric"><strong>${EXAM_COUNT}</strong><span>Frågor</span></div><div class="metric"><strong>${EXAM_MINS} min</strong><span>Tid</span></div><div class="metric"><strong>${TOPICS.length}</strong><span>Ämnen</span></div></div><p>Frågorna blandas från tillgängliga ämnen utan upprepning. Du kan navigera och bokmärka frågor. Inget facit visas förrän du lämnat in eller tiden gått ut.</p><p class="disclaimer">Detta är egna övningsfrågor, inte Naturvårdsverkets prov. Frågebanken innehåller också tidigare demonstrationsfrågor som ännu inte granskats individuellt.</p>${button(FULL_EXAM?'Starta 70-frågorsprov':'Starta mini-prov','startExam')}</div></div>`;
    document.getElementById('home').onclick=showHome;document.getElementById('startExam').onclick=()=>start('exam','Blandat',EXAM_COUNT);
  }
  function showReviewSetup(){
    view='setup';let weak=QUESTIONS.filter(q=>{const s=state.stats[q.id];return s&&(s.wrong>0||s.uncertain>0)});
    root.innerHTML=`<div class="stack"><div>${button('← Startsidan','home','ghost')}</div><div class="card stack"><div class="eyebrow">REPETITION</div><h2>Återvänd till svåra frågor</h2><p>${weak.length?`Du har ${weak.length} frågor med tidigare fel eller osäkerhetsmarkeringar.`:'Inga markerade eller felbesvarade frågor ännu. Genomför lite ämnesträning först.'}</p>${button('Starta repetition','startReview') }</div></div>`;
    document.getElementById('home').onclick=showHome;
    const b=document.getElementById('startReview');b.disabled=weak.length===0;b.onclick=()=>start('review','Blandat',Math.min(10,weak.length));
  }
  function sample(mode,topic,count,subtopic='Alla'){
    if(mode==='exam'){return shuffle(QUESTIONS).slice(0,count)}
    let pool=mode==='review'?QUESTIONS.filter(q=>{const s=state.stats[q.id];return s&&(s.wrong||s.uncertain)}):QUESTIONS.filter(q=>(topic==='Blandat'||q.topic===topic)&&(subtopic==='Alla'||(q.subcategory||q.topic)===subtopic));
    // Föredra obesvarade frågor. Dra slumpmässigt bland frågor med samma antal tidigare försök.
    return shuffle(pool).sort((a,b)=>(state.stats[a.id]?.seen||0)-(state.stats[b.id]?.seen||0)).slice(0,count);
  }
  function start(mode,topic,count,subtopic='Alla'){
    if(session&&!confirm('Ett tidigare pass är inte färdigt. Vill du ersätta det?'))return;
    const pool=sample(mode,topic,count,subtopic);if(!pool.length){showHome();return}
    session={mode,topic,subtopic,ids:pool.map(q=>q.id),index:0,choices:{},uncertain:{},confirmed:{},started:Date.now(),deadline:mode==='exam'?Date.now()+EXAM_MINS*60*1000:null};
    saveSession();view='play';renderQuestion();
  }
  function currentQ(){return INDEX.get(session.ids[session.index])}
  function remaining(){return session&&session.deadline?Math.max(0,session.deadline-Date.now()):0}
  function timeLabel(ms){const sec=Math.ceil(ms/1000);return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
  function renderQuestion(){
    if(!session){showHome();return}
    if(session.mode==='exam'&&remaining()===0){finish(true);return}
    view='play';const q=currentQ(),at=session.index,total=session.ids.length,answered=Object.keys(session.confirmed).length;
    const isExam=session.mode==='exam';const locked=!!session.confirmed[q.id],selected=session.choices[q.id];const isUncertain=!!session.uncertain[q.id];
    root.innerHTML=`<div class="stack">
    <div class="qtop"><button class="button ghost" id="exit">← Avsluta</button><div class="buttons"><span class="pill ${isExam?'exam':''}">${isExam?(FULL_EXAM?'PROVLÄGE':'MINI-PROV'):'TRÄNING'}</span>${isExam?`<span class="pill warn" id="timer">${timeLabel(remaining())}</span>`:''}</div></div>
    <div class="card"><div class="qtop"><span class="small muted">Fråga ${at+1} av ${total}</span><span class="tiny muted">${escapeHTML(q.topic)} · ${escapeHTML(q.subcategory||q.topic)}</span></div><div class="progressbar"><div style="width:${100*(at+1)/total}%"></div></div>
    <div class="questionTitle">${escapeHTML(q.question)}</div>
    ${imageHtml(q.image)}
    <div role="group" aria-label="Svarsalternativ">${q.options.map((o,i)=>`<button class="choice ${selected===i?'selected':''} ${locked&&i===q.answer?'correct':''} ${locked&&selected===i&&i!==q.answer?'wrong':''}" data-choice="${i}" ${locked?'disabled':''} aria-pressed="${selected===i}"><span class="letter">${letters[i]}</span><span class="option-body"><span>${escapeHTML(o.text)}</span>${imageHtml(o.image,true)}</span></button>`).join('')}</div>
    <label class="qflag"><input type="checkbox" id="uncertain" ${isUncertain?'checked':''}> Markera som osäker / bokmärk</label>
    ${locked&&!isExam?feedback(q,selected):''}
    <hr class="rule"><div class="buttons"><button class="button alt" id="prev" ${at===0?'disabled':''}>← Föregående</button><div class="grow"></div>${!isExam&&!locked?button('Rätta svar','check'):''}${at<total-1?button('Nästa →','next'):button(isExam?'Lämna in mini-prov':'Visa resultat','finish')}</div>
    </div>
    ${isExam?`<div class="card"><div class="qtop"><strong class="small">Frågeöversikt</strong><span class="tiny muted">${Object.keys(session.choices).length}/${total} besvarade</span></div><div class="numbernav" style="margin-top:12px">${session.ids.map((id,i)=>`<button class="numbtn ${i===at?'active':''} ${session.choices[id]!=null?'answered':''} ${session.uncertain[id]?'flagged':''}" data-jump="${i}" aria-label="Gå till fråga ${i+1}">${i+1}</button>`).join('')}</div></div>`:''}
    </div>`;
    document.getElementById('exit').onclick=()=>{if(confirm('Avsluta passet? Dina svar i pågående pass raderas, men tidigare resultat finns kvar.')){session=null;saveSession();showHome()}};
    root.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(locked)return;session.choices[q.id]=Number(b.dataset.choice);saveSession();renderQuestion()});
    document.getElementById('uncertain').onchange=e=>{session.uncertain[q.id]=e.target.checked;saveSession()};
    document.getElementById('prev').onclick=()=>{session.index--;saveSession();renderQuestion()};
    const next=document.getElementById('next');if(next)next.onclick=()=>{session.index++;saveSession();renderQuestion()};
    const check=document.getElementById('check');if(check){check.disabled=selected==null;check.onclick=()=>{session.confirmed[q.id]=true;record(q,session.choices[q.id],!!session.uncertain[q.id]);persist();saveSession();renderQuestion()}};
    const fin=document.getElementById('finish');if(fin)fin.onclick=()=>{
      if(isExam){const unanswered=session.ids.filter(id=>session.choices[id]==null).length;if(unanswered&&!confirm(`Du har ${unanswered} obesvarade frågor. Vill du lämna in ändå?`))return}
      else if(!session.ids.every(id=>session.confirmed[id])){if(!confirm('Det finns frågor som inte är rättade. De räknas som obesvarade. Vill du avsluta?'))return}
      finish(false)
    };
    root.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{session.index=Number(b.dataset.jump);saveSession();renderQuestion()});
  }
  function feedback(q,selected){return `<div class="feedback"><strong class="${selected===q.answer?'good':'bad'}">${selected===q.answer?'Rätt svar':'Inte riktigt'} — rätt svar är ${letters[q.answer]}</strong>${q.options.map((o,i)=>`<article><b class="${i===q.answer?'good':i===selected?'bad':''}">${letters[i]}. ${escapeHTML(o.text)}</b>${o.image?`<div style="margin:8px 0">${imageHtml(o.image,true)}</div>`:''}<br><span class="muted">${escapeHTML(o.explanation)}</span></article>`).join('')}${q.ref?`<a class="small" target="_blank" rel="noopener noreferrer" href="${escAttr(q.ref)}">Läs källan ↗</a>`:''}<p class="tiny muted" style="margin-top:10px">Granskningsstatus: ${escapeHTML(q.verification||'okänd')}${q.source_date?' · '+escapeHTML(q.source_date):''}</p></div>`}
  function finish(timeout){
    if(!session)return;const ended=session;
    if(ended.mode==='exam'){for(const id of ended.ids){let q=INDEX.get(id);record(q,ended.choices[id],!!ended.uncertain[id])}}
    persist();let n=ended.ids.reduce((s,id)=>s+(ended.choices[id]===INDEX.get(id).answer?1:0),0);const total=ended.ids.length;
    const a={id:Date.now(),mode:ended.mode,date:Date.now(),correct:n,total,topic:ended.topic,timeout:!!timeout,items:ended.ids.map(id=>({id,choice:ended.choices[id]??null,uncertain:!!ended.uncertain[id]}))};
    state.attempts.unshift(a);state.attempts=state.attempts.slice(0,60);persist();session=null;saveSession();showResult(a);
  }
  function showResult(a){view='result';currentResult=a;
    const questions=a.items.map(item=>({q:INDEX.get(item.id),...item})).filter(x=>x.q);
    root.innerHTML=`<div class="stack"><div class="eyebrow">${a.mode==='exam'?'RESULTAT: PROVLÄGE':'RESULTAT: TRÄNING'}</div><div class="card stack"><div class="resultscore">${a.correct}/${a.total}</div><h2 style="margin:0">${pct(a.correct,a.total)} procent rätt</h2><p class="muted">${a.timeout?'Tiden gick ut. Obesvarade frågor räknas som fel.':'Passet är färdigt.'} ${a.mode==='exam'?(FULL_EXAM?((a.correct>=60?'Godkänd nivå':'Under godkänd nivå')+' enligt poänggränsen 60/70 för det officiella teoriprovet. Detta är ett inofficiellt övningsprov.'): 'Det här var ett kort övningsprov, inte ett officiellt godkänt/underkänt-resultat.'):''}</p><div class="buttons">${button('Till startsidan','toHome')}${button('Nytt träningspass','again','alt')}</div></div><div><h2>Gå igenom svaren</h2><p class="small muted">Tryck på en fråga för att se förklaringen till samtliga fyra alternativ.</p></div>${questions.map((x,i)=>`<details class="result-item"><summary><span class="sign ${x.choice===x.q.answer?'good':'bad'}">${x.choice===x.q.answer?'✓':'×'}</span><span>${i+1}. ${escapeHTML(x.q.question)} ${x.uncertain?'<span class="pill warn">Osäker</span>':''}</span></summary><div class="inside">${imageHtml(x.q.image)}<p class="small muted">Ditt svar: ${x.choice==null?'Inget svar':letters[x.choice]}. Rätt svar: ${letters[x.q.answer]}.</p>${feedback(x.q,x.choice)}</div></details>`).join('')}</div>`;
    document.getElementById('toHome').onclick=showHome;document.getElementById('again').onclick=()=>showTrainSetup(a.mode==='practice'?a.topic:'Blandat');window.scrollTo(0,0);
  }
  function showStats(){view='stats';const summary=statsSummary();const topics=TOPICS.map(t=>{const qs=QUESTIONS.filter(q=>q.topic===t);const stats=qs.map(q=>state.stats[q.id]).filter(Boolean);const attempts=stats.reduce((s,x)=>s+x.seen,0);const correct=stats.reduce((s,x)=>s+x.correct,0);return{t,seen:stats.length,attempts,correct}});
    root.innerHTML=`<div class="stack"><div>${button('← Startsidan','home','ghost')}</div><div><div class="eyebrow">DIN STATISTIK</div><h1>Utveckling</h1></div><div class="card stack"><div class="gridstats"><div class="metric"><strong>${totalSeen()}/${QUESTIONS.length}</strong><span>Unika sedda</span></div><div class="metric"><strong>${pct(summary.correct,summary.answered)} %</strong><span>Alla svar</span></div><div class="metric"><strong>${state.attempts.length}</strong><span>Pass</span></div></div><h2>Per ämne</h2>${topics.map(x=>`<div class="category-row"><div style="flex:1"><strong class="small">${escapeHTML(x.t)}</strong><div class="tiny muted">${x.seen}/${QUESTIONS.filter(q=>q.topic===x.t).length} unika · ${x.attempts} svar</div><div class="mini-bar"><div style="width:${pct(x.correct,x.attempts)}%"></div></div></div><strong>${x.attempts?pct(x.correct,x.attempts)+' %':'–'}</strong></div>`).join('')}</div><div class="card stack"><h2>Senaste pass</h2>${state.attempts.length?state.attempts.slice(0,8).map(a=>`<div class="category-row"><span>${escapeHTML(dateTime(a.date))} · ${a.mode==='exam'?'Provläge':escapeHTML(a.topic)}</span><strong>${a.correct}/${a.total}</strong></div>`).join(''):'<p class="muted">Inga avslutade pass än.</p>'}<div class="buttons">${button('Exportera mina resultat','exportStats','alt')}${button('Importera resultat','importStats','alt')}${button('Nollställ statistik','clearStats','danger')}</div><input id="importFile" type="file" accept=".json,application/json" class="hidden"></div></div>`;
    document.getElementById('home').onclick=showHome;
    document.getElementById('exportStats').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,stats:state.stats,attempts:state.attempts},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='jagarprovet-resultat.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};
    document.getElementById('importStats').onclick=()=>document.getElementById('importFile').click();
    document.getElementById('importFile').onchange=async(e)=>{try{const f=e.target.files[0];if(!f)return;const v=JSON.parse(await f.text());if(v.version!==1||typeof v.stats!=='object'||!Array.isArray(v.attempts))throw Error('Ogiltig fil');if(!confirm('Importera filen? Nuvarande sparade resultat ersätts.'))return;state.stats=v.stats;state.attempts=v.attempts;persist();showStats()}catch{alert('Kunde inte läsa resultatfilen.')}};
    document.getElementById('clearStats').onclick=()=>{if(confirm('Ta bort alla sparade resultat på denna enhet? Detta går inte att ångra.')){state.stats={};state.attempts=[];persist();showStats()}};
  }
  function showImageEditor(){
    view='editor';
    const workingBank=QUESTIONS.map(q=>structuredClone(q));
    const draftIndex=new Map(workingBank.map(q=>[q.id,q]));
    const changedTargets=new Set();
    const topics=[...new Set(workingBank.map(q=>q.topic))];
    root.innerHTML=`<div class="stack"><div>${button('← Startsidan','editorHome','ghost')}</div><div><div class="eyebrow">REDIGERA FRÅGEBANKEN</div><h1>Bildverktyg</h1><p class="lead">Välj en fråga, ange en bildadress eller välj ett foto från telefonen och hämta en uppdaterad fragor.json. Allt sker lokalt i webbläsaren.</p></div>
      <div class="card stack">
      <div class="formrow"><div class="field"><label for="editTopic">Ämne</label><select id="editTopic">${topics.map(t=>`<option value="${escAttr(t)}">${escapeHTML(t)}</option>`).join('')}</select></div><div class="field"><label for="editQuestion">Fråga</label><select id="editQuestion"></select></div></div>
      <div class="field"><label for="editPlace">Var ska bilden synas?</label><select id="editPlace"><option value="question">Under frågetexten</option><option value="0">Vid svar A</option><option value="1">Vid svar B</option><option value="2">Vid svar C</option><option value="3">Vid svar D</option></select></div>
      <hr class="rule">
      <div class="field"><label for="editSrc">Bildadress (direkt HTTPS-länk eller sökväg, t.ex. bilder/radjur.jpg)</label><input type="text" id="editSrc" placeholder="bilder/mitt-foto.jpg"></div>
      <div class="field"><label for="editFile">Eller välj en bild från telefonen</label><input type="file" id="editFile" accept="image/jpeg,image/png,image/webp,image/gif"><span class="tiny muted">Bilden laddas inte upp automatiskt. Du laddar sedan även upp fotot i mappen bilder/ på GitHub.</span></div>
      <div class="field"><label for="editAlt">Bildbeskrivning (utan att avslöja facit)</label><input type="text" id="editAlt" placeholder="Exempel: Fågel på vatten med svartvit fjäderdräkt"></div>
      <div class="field"><label for="editCaption">Bildtext (valfri)</label><input type="text" id="editCaption" placeholder="Exempel: Identifiera arten på fotografiet"></div>
      <div class="formrow"><div class="field"><label for="editCredit">Fotograf / bildkälla</label><input type="text" id="editCredit" placeholder="Fotografens namn · CC BY-SA 4.0"></div><div class="field"><label for="editCreditUrl">Länk till bildens upphov och licens (valfri)</label><input type="url" id="editCreditUrl" placeholder="https://commons.wikimedia.org/wiki/File:..."></div></div>
      <div class="editor-preview" id="editorPreview"></div>
      <p id="editorStatus" role="status" class="small muted">Inga ändringar sparade i utkastet ännu.</p>
      <div class="buttons">${button('Spara bild i utkast','saveImage')}${button('Ta bort bild ur utkast','removeImage','alt')}</div>
      <div class="buttons">${button('Ladda ned fragor.json med alla ändringar','exportImages')}</div>
      <div class="editor-info"><b>Viktigt:</b> Spara varje bild i utkastet innan du byter fråga, och ladda ned JSON-filen när alla är klara. Verktyget ändrar inte hemsidan direkt. Ersätt sedan <code>fragor.json</code> på GitHub. Har du valt en fil från telefonen ska du även ladda upp den i mappen <code>bilder/</code>. Befintlig statistik försvinner inte, eftersom frågans ID behålls.</div>
      </div></div>`;
    document.getElementById('editorHome').onclick=showHome;
    const getQ=()=>draftIndex.get(document.getElementById('editQuestion').value);
    const getTarget=q=>document.getElementById('editPlace').value==='question'?q:q.options[Number(document.getElementById('editPlace').value)];
    let selectedFile=null,previewUrl=null;
    function clearPreviewUrl(){if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=null}}
    function populateQuestions(){
      const topic=document.getElementById('editTopic').value;
      const items=workingBank.filter(q=>q.topic===topic);
      document.getElementById('editQuestion').innerHTML=items.map(q=>`<option value="${escAttr(q.id)}">${escapeHTML(q.id+' · '+q.question.slice(0,75))}</option>`).join('');
      fillFromQuestion();
    }
    function fillFromQuestion(){
      clearPreviewUrl();selectedFile=null;document.getElementById('editFile').value='';
      const q=getQ();if(!q)return;
      const m=mediaObj(getTarget(q).image)||{};
      for(const [id,key] of [['editSrc','src'],['editAlt','alt'],['editCaption','caption'],['editCredit','credit'],['editCreditUrl','creditUrl']])document.getElementById(id).value=m[key]||'';
      renderPreview();
    }
    function renderPreview(){
      const box=document.getElementById('editorPreview');
      const src=selectedFile?previewUrl:safeImageSrc(document.getElementById('editSrc').value);
      box.innerHTML=src?`<div class="small muted" style="margin-bottom:6px">Förhandsgranskning</div><img class="quiz-image" alt="Förhandsgranskning" src="${escAttr(src)}"><div class="tiny muted" style="margin-top:6px">${escapeHTML(getQ()?.question||'')}</div>`:'<p class="small muted">Ingen bild vald ännu.</p>';
    }
    document.getElementById('editTopic').onchange=populateQuestions;
    document.getElementById('editQuestion').onchange=fillFromQuestion;
    document.getElementById('editPlace').onchange=fillFromQuestion;
    document.getElementById('editSrc').oninput=()=>{selectedFile=null;clearPreviewUrl();renderPreview()};
    document.getElementById('editFile').onchange=e=>{
      clearPreviewUrl();selectedFile=e.target.files?.[0]||null;
      if(!selectedFile){renderPreview();return}
      if(!/^image\/(?:jpeg|png|webp|gif)$/.test(selectedFile.type) || !/\.(png|jpe?g|webp|gif)$/i.test(selectedFile.name)){
        alert('Välj JPG, PNG, WebP eller GIF. HEIC behöver först konverteras till JPG.');selectedFile=null;e.target.value='';return;
      }
      const suggested='bilder/'+selectedFile.name;
      if(!safeImageSrc(suggested)){alert('Döp om filen till ett enkelt namn utan specialtecken, till exempel radjur.jpg.');selectedFile=null;e.target.value='';return}
      previewUrl=URL.createObjectURL(selectedFile);
      document.getElementById('editSrc').value=suggested;renderPreview();
    };
    function saveDraft(remove){
      const q=getQ();if(!q)return;
      const src=String(document.getElementById('editSrc').value||'').trim();
      if(!remove&&!safeImageSrc(src)){alert('Ange en giltig HTTPS-bildlänk eller bilder/filnamn.jpg, .png, .webp eller .gif.');return}
      const creditUrl=document.getElementById('editCreditUrl').value.trim();
      if(!remove&&creditUrl&&!safeWebLink(creditUrl)){alert('Källänken måste börja med https://');return}
      const alt=document.getElementById('editAlt').value.trim();
      if(!remove&&!alt){alert('Lägg till en kort bildbeskrivning som inte avslöjar svaret.');return}
      const entry=getTarget(q);
      if(remove){delete entry.image}else{
        entry.image={src,alt};
        for(const [key,id] of [['caption','editCaption'],['credit','editCredit'],['creditUrl','editCreditUrl']]){
          const val=document.getElementById(id).value.trim();if(val)entry.image[key]=val;
        }
      }
      changedTargets.add(q.id+'-'+document.getElementById('editPlace').value);
      document.getElementById('editorStatus').textContent=`${changedTargets.size} bildpositioner ändrade i utkastet. Tryck på ”Ladda ned fragor.json” när du är klar.`;
      if(remove)fillFromQuestion();
    }
    document.getElementById('saveImage').onclick=()=>saveDraft(false);
    document.getElementById('removeImage').onclick=()=>saveDraft(true);
    document.getElementById('exportImages').onclick=()=>{
      if(!changedTargets.size){alert('Spara minst en bildändring i utkastet först.');return}
      downloadJson(workingBank,'fragor.json');
      document.getElementById('editorStatus').textContent=`Alla ${changedTargets.size} bildändringar är nedladdade i fragor.json. Ladda upp filen till GitHub för att publicera.`;
    };
    populateQuestions();
  }
  root.addEventListener('error',e=>{
    const img=e.target;
    if(!(img instanceof HTMLImageElement)||!(img.classList.contains('quiz-image')||img.classList.contains('option-image')))return;
    img.hidden=true;
    const note=document.createElement('span');note.className='small muted';
    note.textContent='Bilden kunde inte laddas. Kontrollera att länken går direkt till bilden eller att filen finns i bilder/.';
    img.insertAdjacentElement('afterend',note);
  },true);
  const logo=document.getElementById('logo');logo.onclick=e=>{e.preventDefault();showHome()};
  if(session && (!Array.isArray(session.ids)||session.ids.some(id=>!INDEX.has(id)))){session=null;saveSession()}
  showHome();
  setInterval(()=>{if(session&&session.mode==='exam'){
    const badge=document.getElementById('timer');if(badge)badge.textContent=timeLabel(remaining());
    if(remaining()<=0)finish(true)
  }},1000);
  // Tvåfilsversion: ingen service worker behövs. JSON hämtas vid varje sidladdning.
})();

}

  const root = document.getElementById('app');
  root.innerHTML = '<div class="card" role="status"><h2>Läser in frågebanken …</h2><p class="muted">Laddar fragor.json</p></div>';
  // Om en tidigare PWA-version körts på denna adress: avregistrera dess gamla cache-worker.
  if ('serviceWorker' in navigator && location.protocol.startsWith('https')) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      regs.forEach(reg => { if (reg.active && /\bsw\.js(?:\?|$)/.test(new URL(reg.active.scriptURL).pathname)) reg.unregister(); });
    }).catch(() => {});
  }
  function validate(data) {
    if (!Array.isArray(data) || !data.length) throw new Error('Frågebanken måste vara en JSON-lista med minst en fråga.');
    const used = new Set();
    for (let i=0; i<data.length; i++) {
      const q = data[i]; const loc = `Fråga ${i+1}`;
      if (!q || typeof q.id!=='string' || !q.id.trim() || used.has(q.id)) throw new Error(`${loc}: ID saknas eller är dubblerat.`);
      used.add(q.id);
      if (typeof q.topic!=='string' || !q.topic.trim() || typeof q.question!=='string' || !q.question.trim()) throw new Error(`${loc}: ämne eller frågetext saknas.`);
      if (!Array.isArray(q.options) || q.options.length!==4) throw new Error(`${loc}: exakt fyra svarsalternativ krävs.`);
      if (!Number.isInteger(q.answer) || q.answer<0 || q.answer>3) throw new Error(`${loc}: answer ska vara 0, 1, 2 eller 3.`);
      for (const o of q.options) if (!o || typeof o.text!=='string' || !o.text.trim() || typeof o.explanation!=='string' || !o.explanation.trim()) throw new Error(`${loc}: svarstext eller förklaring saknas.`);
      const checkImage=(m,name)=>{
        if(m==null)return;
        if(typeof m==='string'){if(!m.trim())throw new Error(`${loc}: tom bildadress (${name}).`);return;}
        if(typeof m!=='object'||typeof m.src!=='string'||!m.src.trim())throw new Error(`${loc}: felaktigt bildobjekt (${name}).`);
        if(typeof m.alt!=='string'||!m.alt.trim())throw new Error(`${loc}: bildbeskrivning saknas (${name}).`);
      };
      checkImage(q.image,'fråga');
      q.options.forEach((o,j)=>checkImage(o.image,'alternativ '+('ABCD'[j])));
    }
    return data;
  }
  function launch(data) {
    window.QUESTIONS = validate(data);
    document.getElementById('topBadge').textContent = `${data.length} övningsfrågor · Beta`;
    START_JAGARPROVET_APP();
  }
  function showError(error) {
    root.innerHTML = '<div class="card stack"><h2>Kunde inte läsa frågorna</h2><p id="loadError" class="muted"></p><p>På GitHub Pages måste <b>index.html</b> och <b>fragor.json</b> ligga i samma mapp. Om du öppnar HTML-filen direkt från telefonens lagring kan webbläsaren blockera JSON-inläsningen.</p><div class="buttons"><button class="button" type="button" id="retry">Försök igen</button><label class="button alt" for="localJson" style="cursor:pointer">Välj en lokal JSON-fil</label></div><input id="localJson" type="file" accept=".json,application/json" class="hidden"></div>';
    document.getElementById('loadError').textContent = String(error.message || error);
    document.getElementById('retry').onclick = load;
    document.getElementById('localJson').onchange = async e => {
      try {
        if (e.target.files && e.target.files[0]) launch(JSON.parse(await e.target.files[0].text()));
      } catch(err) { showError(err); }
    };
  }
  async function load() {
    try {
      const res = await fetch('./fragor.json?uppdaterad=' + Date.now(), {cache:'no-store'});
      if (!res.ok) throw new Error(`HTTP ${res.status} vid hämtning av fragor.json`);
      launch(await res.json());
    } catch(e) { showError(e); }
  }
  load();

</script>
